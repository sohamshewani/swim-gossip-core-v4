[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swim-gossip-core"
version = "0.1.0"
description = "High-performance SWIM gossip protocol core engine."
readme = "README.md"
authors = [
    { name = "Engineering", email = "engineering@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["swim_gossip_core"]

[tool.setuptools.build-ext]
# Optimization flags injected globally for C/C++ extensions
# Note: Setuptools passes extra compile args per-extension, but these defaults apply globally if configured.

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.poe.tasks]
all = ["clean", "build", "test"]
build = { script = "python setup.py build_ext --inplace", help = "Build C/C++ extensions with optimization flags" }
test = { cmd = "pytest", help = "Run test suite safely" }
clean = { script = "import shutil, pathlib\n[shutil.rmtree(p, ignore_errors=True) for p in ['build', 'dist', '.pytest_cache', '__pycache__']]\n[p.unlink() for p in pathlib.Path('.').rglob('*.so')]\n[p.unlink() for p in pathlib.Path('.').rglob('*.pyd')]\n[p.unlink() for p in pathlib.Path('.').rglob('*.pyc')]", help = "Clean build artifacts and caches safely" }
benchmark = { cmd = "pytest --benchmark-only", help = "Run performance benchmarks" }

[dependency-groups]
dev = [
    "poethepoet>=0.24.0",
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
]